services:
  urlshortner-web:
    container_name: urlshortner-web
    build:
      context: .
      dockerfile: apps/web/dockerfile.dev
    env_file:
      - ./apps/web/.env      
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          cpus: "1.5"  
    restart: unless-stopped

  data-collector:
    container_name: data-collector
    build:
      context: .
      dockerfile: apps/data-collector/dockerfile.dev  
    ports:
      - "3012:3012"
    restart: unless-stopped
    networks:
      - rabbitmq_net
    deploy:
      resources:
        limits:
          cpus: "1"  
    depends_on:
      - rabbitmq
      - nats
  
  ws-server:
    container_name: ws-server
    build:
      context: .
      dockerfile: apps/ws-server/dockerfile.dev
    env_file:
      - ./apps/ws-server/.env   
    ports:
      - "8080:8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
    networks:
      - rabbitmq_net
    depends_on:
      - rabbitmq
      - nats

  http-server:
    container_name: http-server
    build:
      context: .
      dockerfile: apps/http-server/dockerfile.dev
    deploy:
      resources:
        limits:
          cpus: "1"  
    env_file:
      - ./apps/http-server/.env     
    ports:
      - "3001:3001"
    
    restart: unless-stopped
    networks:
      - rabbitmq_net
    depends_on:
      - rabbitmq
      - nats

  short-urlconverter:
    container_name: shorturl-converter
    build:
      context: .
      dockerfile: apps/shorturl-converter/dockerfile.dev
    env_file:
      - ./apps/shorturl-converter/.env  
    ports:
      - "3011:3011"
    networks:
      - rabbitmq_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
    depends_on:
      - rabbitmq
      - nats
    
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    hostname: rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-admin123}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}

      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit loopback_users []"
      RABBITMQ_HIPE_COMPILE: 0

      # RABBITMQ_NODENAME: rabbit@rabbitmq
      # RABBITMQ_USE_LONGNAME: "false"
    ports:
      # Expose for local dev
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      # - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins
      # - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    deploy:
      resources:
        limits:
          cpus: "2"  

    networks:
      - rabbitmq_net
  nats:
    image: nats:2.10
    container_name: nats-server
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "4222:4222"  # NATS clients
      - "8222:8222"  # Monitoring endpoint
      - "6222:6222"  # Clustering (optional)
    volumes:
      - ./packages/nats-server/src/nats/nats.conf:/etc/nats/nats.conf
      - nats_data:/data/nats
    deploy:
      resources:
        limits:
          cpus: "1.5"
    restart: unless-stopped
    networks:
      - rabbitmq_net

volumes:
  rabbitmq_data:
  nats_data:
  
networks:
  rabbitmq_net:
    driver: bridge
